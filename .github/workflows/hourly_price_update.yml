# .github/workflows/hourly_price_update.yml
name: Hourly Price Update

on:
  schedule:
    # Chạy vào đầu mỗi giờ
    - cron: '0 * * * *'
  workflow_dispatch: # Cho phép chạy thủ công từ tab Actions

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Hoặc phiên bản python của dự án

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt # Giả sử bạn có file requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps

      - name: Run hourly price update script
        env:
          # Lưu chuỗi kết nối MongoDB của bạn dưới dạng secret trong repo GitHub
          # Settings -> Secrets and variables -> Actions -> New repository secret
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: python scripts/update_prices.py