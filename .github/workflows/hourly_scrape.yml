name: Hourly Price Scrape

on:
  schedule:
    # Chạy mỗi giờ vào phút thứ 0
    - cron: '0 * * * *'
  workflow_dispatch:   # Cho phép chạy thủ công từ GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Tránh timeout mặc định 360 phút

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'  # Cache pip để cài nhanh hơn

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Run hourly scrape
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MONGO_DB: ${{ secrets.MONGO_DB }}
          # Tắt TensorFlow oneDNN warnings
          TF_ENABLE_ONEDNN_OPTS: 0
          TF_CPP_MIN_LOG_LEVEL: 3
        run: |
          echo "=== Starting hourly scrape ==="
          python scripts/hourly_scrape.py 2>&1
          echo "=== Scrape completed (exit code: $?) ==="